<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva solicitud | ZoFranca CR</title>
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/responsive.css">
</head>
<body data-page="solicitudes">
  <main class="main-content">
    <section class="page-heading">
      <div><h1>Nueva solicitud</h1><p>Complete los datos de la empresa para iniciar el trámite de ingreso.</p></div>
      <a class="btn btn-secondary" href="index.html">Volver al Dashboard</a>
    </section>

    <div id="statusBanner" class="alert status-banner" role="status" aria-live="polite" hidden>
      <i data-status-icon data-lucide="info" aria-hidden="true"></i>
      <div><strong id="statusTitle">Estado</strong><p id="statusMessage" class="muted"></p></div>
    </div>

    <form id="solicitudForm" class="card" novalidate>
      <div class="card-header">
        <div><h2 class="card-title">Datos de la empresa</h2><p class="card-subtitle">Los campos marcados son obligatorios.</p></div>
        <span class="badge badge-info">Solicitud</span>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label for="empresa">Nombre de la empresa *</label>
          <input class="input" id="empresa" name="empresa" type="text" autocomplete="organization" required>
          <span class="field-error" data-error-for="empresa"></span>
        </div>
        <div class="form-group">
          <label for="cedulaJuridica">Cédula jurídica *</label>
          <input class="input" id="cedulaJuridica" name="cedulaJuridica" type="text" placeholder="3-101-000000" required>
          <span class="field-error" data-error-for="cedulaJuridica"></span>
        </div>
        <div class="form-group">
          <label for="sector">Sector *</label>
          <select class="select" id="sector" name="sector" required>
            <option value="">Seleccione un sector</option>
            <option value="tecnologia">Tecnología</option>
            <option value="manufactura">Manufactura</option>
            <option value="bpo">BPO</option>
            <option value="logistica">Logística</option>
            <option value="dispositivos-medicos">Dispositivos médicos</option>
          </select>
          <span class="field-error" data-error-for="sector"></span>
        </div>
        <div class="form-group">
          <label for="correo">Correo electrónico *</label>
          <input class="input" id="correo" name="correo" type="email" autocomplete="email" required>
          <span class="field-error" data-error-for="correo"></span>
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono *</label>
          <input class="input" id="telefono" name="telefono" type="tel" autocomplete="tel" required>
          <span class="field-error" data-error-for="telefono"></span>
        </div>
        <div class="form-group">
          <label for="representante">Representante legal *</label>
          <input class="input" id="representante" name="representante" type="text" autocomplete="name" required>
          <span class="field-error" data-error-for="representante"></span>
        </div>
        <div class="form-group">
          <label for="inversionProyectada">Inversión proyectada (USD) *</label>
          <input class="input" id="inversionProyectada" name="inversionProyectada" type="number" min="1" step="0.01" required>
          <span class="field-error" data-error-for="inversionProyectada"></span>
        </div>
        <div class="form-group">
          <label for="empleosProyectados">Empleos proyectados *</label>
          <input class="input" id="empleosProyectados" name="empleosProyectados" type="number" min="1" step="1" required>
          <span class="field-error" data-error-for="empleosProyectados"></span>
        </div>
        <div class="form-group form-group-full">
          <label for="descripcion">Descripción del proyecto *</label>
          <textarea class="textarea" id="descripcion" name="descripcion" required></textarea>
          <span class="field-error" data-error-for="descripcion"></span>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="btnSubmit" type="submit"><i data-lucide="send" aria-hidden="true"></i><span>Enviar solicitud</span></button>
      </div>
    </form>
  </main>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/mobile-preview.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/solicitudes.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
